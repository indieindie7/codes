<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Statue Viewer</title>
<style>
:root{--bg:#1b1b1d;--fg:#e8e6e1;--mute:#9a978f;--btn:#2c2c30;--acc:#d9b27c}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:grab}
#ui{position:fixed;left:12px;top:12px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100vw - 24px);align-items:center}
button{background:var(--btn);color:var(--fg);border:1px solid #444;border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
button.on{border-color:var(--acc);color:var(--acc)}
label{color:var(--mute);display:flex;gap:6px;align-items:center}
#help{position:fixed;left:12px;bottom:10px;color:var(--mute);font-size:12px}
#legend{position:fixed;right:12px;top:12px;font-size:12px;color:var(--mute);display:none}
#legend i{display:inline-block;width:10px;height:10px;margin-right:6px;border-radius:2px}
</style></head><body>
<canvas id="c"></canvas>
<div id="ui">
 <button data-v="0,0">Front</button><button data-v="90,0">Left</button><button data-v="-90,0">Right</button>
 <button data-v="180,0">Back</button><button data-v="35,-25">3/4 high</button>
 <button id="spin">Spin</button><button id="srcb">Which photo</button>
 <button id="wire">Wire</button>
</div>
<div id="legend"></div>
<div id="help">Drag: orbit · Wheel/pinch: zoom · Right-drag or Shift-drag: pan</div>
<script>
const D=/*DATA*/null;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const pos=new Float32Array(b64(D.pos).buffer), col=b64(D.col), src=b64(D.src), idx=new Uint32Array(b64(D.idx).buffer);
const PAL=[[230,159,0],[86,180,233],[0,158,115],[204,121,167],[240,228,66],[213,94,0]];
const srcCol=new Uint8Array(D.n*3);
for(let i=0;i<D.n;i++){const p=src[i]==255?[90,90,90]:PAL[src[i]%PAL.length];srcCol.set(p,i*3)}
const lg=document.getElementById('legend');
lg.innerHTML=D.views.map((v,i)=>`<div><i style="background:rgb(${PAL[i%6]})"></i>${v}</div>`).join('')+'<div><i style="background:#5a5a5a"></i>not seen (filled)</div>';
const cv=document.getElementById('c'),gl=cv.getContext('webgl',{antialias:true});
gl.getExtension('OES_element_index_uint');   // >65k vertices
const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o};
const pr=gl.createProgram();
gl.attachShader(pr,sh(gl.VERTEX_SHADER,`attribute vec3 p;attribute vec3 c;uniform mat4 M;varying vec3 vc;
void main(){gl_Position=M*vec4(p,1.);vc=c;}`));
gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,`precision mediump float;varying vec3 vc;
uniform float K;
void main(){gl_FragColor=vec4(vc*K,1.);}   // vc = a*A+b*B+c*C: GPU lerps the 3 corner colours`));
gl.linkProgram(pr);gl.useProgram(pr);
const buf=(a,n,typ,norm,data)=>{const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,data,gl.STATIC_DRAW);
 const l=gl.getAttribLocation(pr,a);gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,n,typ,norm,0,0);return b};
buf('p',3,gl.FLOAT,false,pos);const cb=buf('c',3,gl.UNSIGNED_BYTE,true,col);
const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,idx,gl.STATIC_DRAW);
const lines=new Uint32Array(D.nf*6);for(let f=0;f<D.nf;f++){const a=idx[f*3],b=idx[f*3+1],c=idx[f*3+2];lines.set([a,b,b,c,c,a],f*6)}
const lb=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,lb);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,lines,gl.STATIC_DRAW);
gl.enable(gl.DEPTH_TEST);gl.enable(gl.POLYGON_OFFSET_FILL);gl.polygonOffset(1,1);gl.clearColor(.106,.106,.114,1);
let yaw=0,pitch=0,dist=2.2,pan=[0,0],spin=false,showSrc=false,wire=false;
function mat(){const W=cv.width,H=cv.height,f=1/Math.tan(.35),a=W/H,n=.05,fa=50;
 const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
 // view = T(pan,-dist) * Rx(pitch) * Ry(yaw)
 const R=[cy,sp*sy,-cp*sy,0, 0,cp,sp,0, sy,-sp*cy,cp*cy,0, pan[0],pan[1],-dist,1];
 const P=[f/a,0,0,0, 0,f,0,0, 0,0,(fa+n)/(n-fa),-1, 0,0,2*fa*n/(n-fa),0];
 const o=new Array(16).fill(0);for(let i=0;i<4;i++)for(let j=0;j<4;j++)for(let k=0;k<4;k++)o[j*4+i]+=P[k*4+i]*R[j*4+k];return o}
function size(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;gl.viewport(0,0,cv.width,cv.height)}
addEventListener('resize',size);size();
function draw(){if(spin)yaw+=.006;gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 gl.uniformMatrix4fv(gl.getUniformLocation(pr,'M'),false,mat());
 const K=gl.getUniformLocation(pr,'K');
 gl.uniform1f(K,1);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.drawElements(gl.TRIANGLES,D.nf*3,gl.UNSIGNED_INT,0);
 if(wire){gl.uniform1f(K,.45);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,lb);gl.drawElements(gl.LINES,D.nf*6,gl.UNSIGNED_INT,0)}requestAnimationFrame(draw)}
draw();
let drag=null;const pts=new Map();
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);
 drag={pan:e.button==2||e.shiftKey,x:e.clientX,y:e.clientY};cv.style.cursor='grabbing'});
cv.addEventListener('pointermove',e=>{if(!drag)return;const prev=pts.get(e.pointerId);if(!prev)return;
 if(pts.size==2){const o=[...pts.entries()].find(([k])=>k!=e.pointerId)[1];
  const d0=Math.hypot(prev[0]-o[0],prev[1]-o[1]),d1=Math.hypot(e.clientX-o[0],e.clientY-o[1]);dist=Math.min(8,Math.max(.6,dist*d0/d1));}
 else{const dx=e.clientX-prev[0],dy=e.clientY-prev[1];
  if(drag.pan){pan[0]+=dx*dist/innerHeight;pan[1]-=dy*dist/innerHeight}
  else{yaw+=dx*.008;pitch=Math.max(-1.5,Math.min(1.5,pitch+dy*.008))}}
 pts.set(e.pointerId,[e.clientX,e.clientY])});
const up=e=>{pts.delete(e.pointerId);if(!pts.size){drag=null;cv.style.cursor='grab'}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{e.preventDefault();dist=Math.min(8,Math.max(.6,dist*Math.exp(e.deltaY*.001)))},{passive:false});
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const[a,p]=b.dataset.v.split(',').map(Number);yaw=a*Math.PI/180;pitch=p*Math.PI/180;pan=[0,0]});
const wb=document.getElementById('wire');wb.onclick=()=>{wire=!wire;wb.classList.toggle('on',wire)};
const sb=document.getElementById('spin');sb.onclick=()=>{spin=!spin;sb.classList.toggle('on',spin)};
const qb=document.getElementById('srcb');qb.onclick=()=>{showSrc=!showSrc;qb.classList.toggle('on',showSrc);
 lg.style.display=showSrc?'block':'none';gl.bindBuffer(gl.ARRAY_BUFFER,cb);gl.bufferData(gl.ARRAY_BUFFER,showSrc?srcCol:col,gl.STATIC_DRAW)};
</script></body></html>
