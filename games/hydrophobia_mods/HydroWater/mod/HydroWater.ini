; HydroWater - water solver upgrade for Hydrophobia: Prophecy
; Put this file next to dinput8.dll in the game folder. Lines starting with ; are comments.

[HydroWater]
; mode = hw          run the water on the HydroWater solver (the mod)
; mode = passthrough load the mod but leave the game's own solver in charge (for comparing)
; mode = off         same as passthrough, logs once
mode = hw

; Upgrade stages (1 = on, 0 = off). Stage numbers follow games/hydrophobia-water-upgrade.md.
; 8: safety clamps - velocity capped at half a cell per step, damping at wet/dry edges,
;    the game's hard 1000 x depth momentum cap dropped
clamps = 1
; 5: second-order reconstruction at cell faces - sharper, less smeared waves
recon = 1
; 1: bodies displace volume (needs the body hook; no visible effect until then)
displacement = 0
; 2: capped velocity stamps (needs the body hook)
capped_stamp = 0
; 4a: walls on cell faces (needs wall geometry from the level; off for now)
face_walls = 0
; 7: foam and air bubbles on the water surface, made from the flow (changes the water shader;
;    shaders are cached in shaderCacheHW.bin, the game's own shaderCacheDX.bin is left alone)
foam = 1

; Tuning
alpha = 1.0
c_adapt = 0.2
edge_damp = 0.7
; Foam tuning (leave out for the defaults): foam_gain, air_gain, foam_life, lace,
; bubble_rise, air_to_foam, spread; Ihmsen-style gate: shear_gain (0.5), kin_floor (0.3,
; 1 = slow water foams as much as fast), kin_lo (0.02), kin_hi (0.5)
; foam_gain = 1.0
; foam_strength: how strongly thin foam shows (0 = linear, 2 = default)
foam_strength = 2
; foam_tex = 1 (default) also feeds foam through a world-space texture filled from every sheet each frame,
; so sheets the game never rebuilds (most of a big pool) still show it. 0 = vertex colours only
foam_tex = 1
; depth_colour: how strongly deep water is tinted (red goes first, then green; 0 = off, 1 = default, at most 1)
depth_colour = 1
; depth_scale: water depth (world units) at which the tint reaches about two thirds
depth_scale = 150
; foam_streaks: how strongly foam is drawn as long streaks along the flow (0 = off, 1 = default, at most 1)
foam_streaks = 1
; streak_speed: flow speed (world units per second) at which the streaks reach about two thirds
streak_speed = 120
; ripples: strength of the ripples that travel with the flow (0 = off, 1 = default)
ripples = 1
; dye: how strongly silt (or other dye) carried by the flow tints the water (0 = off, 1 = default).
; Bodies moving through the water and rough water stir it up; it drifts with the flow and fades.
dye = 1
; dye_colour: its colour as red green blue, 0..1 (default murky silt)
dye_colour = 0.30 0.25 0.16
; dye_gain (0.6) and dye_life (seconds, 12) tune how much is stirred up and how long it lasts
; crest_glow: light shining through the thin tops of waves, a green-blue glow (0 = off, 1 = default, at most 1)
crest_glow = 1
; crest_height: how far (world units) a crest stands above the water around it to glow about two thirds of full
crest_height = 3
; wake: a V of foam trailing behind Kate as she wades, at the 19.5 degree angle of a real boat wake (0 = off, 1 = default, at most 1)
wake = 1
; wake_length: length (world units) of each arm of the V at full speed
wake_length = 160
; wake_pull: the water closing in behind Kate drags foam and silt along into her wake (0 = off, 1 = default, at most 1)
wake_pull = 1
; splotch: big slow patches that break up wide fields of thin foam, so they are not one even sheet (0 = off, 1 = default, at most 1)
splotch = 1
; foam_rim: thick foam lumps are darker in the middle and lit at the edge, a cheap self-shadow (0 = off, 1 = default, at most 1)
foam_rim = 1
; foam_spec: bubble glints, tiny sparks on thick foam that drift with the flow, and thick foam keeps part of the water's specular (0 = off, 1 = default, at most 2)
foam_spec = 1
; foam_blur: foam coverage smeared along the flow by its speed, so moving foam streaks and still foam stays crisp (0 = off, 1 = default, at most 3)
foam_blur = 1
; depth_tint: how fast deep water loses red, then green, and fills with the water colour (1 = default, 0 = clear, 2 = murky, at most 4)
depth_tint = 1
; shore_wet: where a sheet thins to nothing the ground under it is darker and shinier, like wet sand (0 = off, 1 = default, at most 2)
shore_wet = 1
; caustics: a web of light on floors and walls under the water, brighter where the surface slopes, fading with depth (0 = off, 1 = default, at most 2)
caustics = 1
; under_fog: floors and walls under the water sink into teal fog, thicker the deeper the water above them (depth_scale sets how fast; 0 = off, 1 = default, at most 2)
under_fog = 1
; foam_cells: foam is a net of cells with the water showing through the holes, like a ship wake (0 = off, 1 = default, at most 1)
foam_cells = 1
; foam_dots: thin foam breaks up into small dots instead of fading out (0 = off, 1 = default, at most 1)
foam_dots = 1
; foam_glow: bioluminescent foam, a faint light of its own in dark scenes (0 = off, the default; 1 = full); glow_colour = r g b
foam_glow = 0
glow_colour = 0.25 0.75 1.0
; spray_draw: the solver's spray drops (breaking crests, slams, impacts, falls) drawn as small particles over the water,
; hidden by Kate and the walls (1 = default, 0 = off); spray_size scales them; spray_colour = r g b opacity;
; spray_rate = drops a cell a second at full strength (library default 30, 0 = none)
spray_draw = 1
spray_size = 1
spray_colour = 0.9 0.95 1.0 0.8
; scum: a floating layer of algae or scum that drifts with the flow, parts around Kate and closes behind her,
; torn up by rough water (0 = off, the default; 0.6 = patchy mats, 1 = thick); scum_colour = r g b
scum = 0
scum_colour = 0.14 0.22 0.06
; debris_wake: foam trail and wake pull behind everything the game pushes through the water (crates, planks), not only Kate (0 = off, 1 = default)
debris_wake = 1
; foam_normals: foam lit as if it stands up from the water, so its edges catch and lose light, with a faint shadow on the water beside thick foam (0 = off, 1 = default, at most 2)
foam_normals = 1
; wet: floors, walls and Kate stay darker and glossier where the water has been, then dry from the top down (0 = off, 1 = default, at most 1.5)
wet = 1
; wet_dry: how fast (world units a second) the wet line sinks as things dry; lower stays wet longer
wet_dry = 1.5
; drench: Kate just out of deep water: wet skin sheen, soaked darker cloth, water running down her and drips
;   on the floor around her, fading over about 2.5 min (0 = off, 1 = default, at most 1.5; needs wet on)
drench = 1
; drench_splash: running through shallow water splashes her higher up in wet patches (0 = off, 1 = default)
drench_splash = 1
; drench_mask: 0 = she soaks everywhere the water reached, 1 = only where the game's own wetness mask allows (it is 0 on Kate, so she stays dry), 2 = show the mask in red, 3 = debug colours
drench_mask = 0
; swim: swimmer wake once the water under Kate is deeper than swim_depth: a bow bump ahead of her chest,
;   a trough at her shoulders, a kick strip behind her feet and white water by effort (0 = off, 1 = default)
swim = 1
swim_depth = 150
; swim_spray: her strokes throw a handful of drops ahead every 0.6 s, one arm then the other;
;   the drops carry water and momentum back into the sheet when they land (0 = off, 1 = default)
swim_spray = 1
; meniscus: the surface bows down around Kate's body and a foam ring sits on the rim (0 = off, 1 = default)
meniscus = 1
; foam_test = 1 paints moving foam bands instead of the simulated foam (to check the look)
; foam_test = 2 makes the shader draw bands from world position, ignoring the mesh (to see which surfaces use the foam shader)
foam_test = 0
; foam_dump = 1 writes the patched water shader text to HydroWater_shaderN.hlsl (for modders);
; foam_dump = 2 also saves every pixel shader the game compiles to HydroWater_shaders (only on a fresh shader cache), 3 the vertex shaders too
foam_dump = 0

; Window
; borderless = 1  run the game in a borderless window the size of its resolution instead of
;                 exclusive fullscreen (instant alt-tab; overlays and captures work)
borderless = 1
; background = 1  keep the game running (no pause) while another window has the focus
background = 0
; control = 1     poll HydroWater.cmd next to the DLL for test commands ("shot <file.bmp>" dumps the
;                 back buffer); for modders and testing, leave at 0 to play
control = 0

; Sheets with more cells than this stay on the game's solver (safety valve)
max_cells = 4096
; Write a line to HydroWater.log every N solver steps per sheet (0 = never)
log_every = 600
